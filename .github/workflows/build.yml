# Builds and tests Z ULT Connect on every push, and attaches the MSI installer
# to every GitHub Release automatically.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Protocol tests
        run: dotnet run --project tests/ProtocolTests -c Release

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ("${{ github.event_name }}" -eq "release") { $v = "${{ github.event.release.tag_name }}".TrimStart("v", "V") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app
        run: dotnet publish ZUltConnect.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Build the installer
        run: dotnet build Installer/ZUltConnect.Installer.wixproj -c Release -p:ProductVersion=${{ steps.ver.outputs.version }} -o installer-out

      - name: Collect the installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem installer-out -Recurse -Filter *.msi | Select-Object -First 1
          Copy-Item $msi.FullName "Z-ULT-Connect-Setup.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: Z-ULT-Connect-Setup
          path: Z-ULT-Connect-Setup.msi

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Z-ULT-Connect-Setup.msi --clobber
